<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telemetry Node</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 2vw; padding: 2vw; }
        .zone { border: 2px dashed #666; padding: 2rem; width: 30vw; text-align: center; transition: background-color 0.2s; }
        .viz { border: 1px solid #333; width: 60vw; min-height: 85vh; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
        .viz-frame { flex: 1; width: 100%; border: none; min-height: 80vh; }
        .btn { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="zone" id="drop-zone">
        <h3>Drag & Drop CSV Payload</h3>
        <p style="color:#666; font-size:14px;">or click to select</p>
        <input type="file" id="file-input" accept=".csv" style="width: 100%; margin-bottom: 20px;">
        <button type="button" class="btn" style="width:100%;" onclick="transmitTelemetry()">Upload & Sync</button>
        
        <form id="hidden-telemetry-form" method="POST" target="viz-frame" style="display:none;">
            <input type="hidden" id="csv-string-payload" name="csvString">
        </form>
    </div>

    <div class="viz">
        <button class="btn" onclick="fetchCurrentChart()">
            Load Current Sheet Data
        </button>
        <iframe id="viz-frame" name="viz-frame" class="viz-frame"></iframe>
    </div>

    <script>
        // Hardcoded endpoint bypasses local file:// protocol fetch restrictions
        const ENDPOINT = "https://script.google.com/macros/s/AKfycbzGIIAS2KibKGRENn90_4r9rz-sNeQzIXxZCc-B60oh8kJtMmIZgIu0-_RLSg0bOV0_tQ/exec";
        
        document.getElementById('hidden-telemetry-form').action = ENDPOINT;

        function fetchCurrentChart() {
            // Append epoch timestamp to bypass browser iframe caching mechanisms
            const cacheBuster = new Date().getTime();
            document.getElementById('viz-frame').src = ENDPOINT + "?t=" + cacheBuster;
        }

        function transmitTelemetry() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files.length) {
                alert("Select CSV file first.");
                return;
            }

            const file = fileInput.files [ 0 ] ;
            const reader = new FileReader();

            reader.onload = function(e) {
                const textContent = e.target.result;
                document.getElementById('csv-string-payload').value = textContent;
                document.getElementById('hidden-telemetry-form').submit();
            };

            reader.readAsText(file);
        }

        // Drag and Drop Pipeline
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = '#e9ecef';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'transparent';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'transparent';
            if (e.dataTransfer.files.length) {
                // Map dropped file array into input element state
                fileInput.files = e.dataTransfer.files;
                // Auto-execute transmission pipeline
                transmitTelemetry(); 
            }
        });

        // Initialize visualization on boot
        window.onload = fetchCurrentChart;
    </script>
</body>
</html>
