<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telemetry Node</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 2vw; padding: 2vw; }
        .zone { border: 2px dashed #666; padding: 2rem; width: 30vw; text-align: center; }
        
        /* Height expanded from 50vh to 85vh */
        .viz { border: 1px solid #333; width: 60vw; min-height: 85vh; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
        
        /* Height expanded from 45vh to 80vh */
        .viz-frame { flex: 1; width: 100%; border: none; min-height: 80vh; }
        
        .btn { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="zone">
        <h3>Upload CSV Payload</h3>
        <input type="file" id="file-input" accept=".csv" style="width: 100%;">
        <button type="button" class="btn" style="margin-top:20px; width:100%;" onclick="transmitTelemetry()">Upload & Sync</button>
        
        <form id="hidden-telemetry-form" method="POST" target="viz-frame" style="display:none;">
            <input type="hidden" id="csv-string-payload" name="csvString">
        </form>
    </div>

    <div class="viz">
        <button class="btn" onclick="fetchCurrentChart()">
            Load Current Sheet Data
        </button>
        <iframe id="viz-frame" name="viz-frame" class="viz-frame"></iframe>
    </div>

    <script>
        // System initialization configuration path
        const CONFIG_SOURCE = "config.txt"; 
        let ENDPOINT = "";

        // Initialization hook: Read path from text file automatically
        fetch(CONFIG_SOURCE)
            .then(res => res.text())
            .then(url => {
                ENDPOINT = url.trim();
                // Assign centralized link parameter to backend form structure
                document.getElementById('hidden-telemetry-form').action = ENDPOINT;
            })
            .catch(err => console.error("Config load failed:", err));

        function fetchCurrentChart() {
            if (!ENDPOINT) return alert("System initializing...");
            document.getElementById('viz-frame').src = ENDPOINT;
        }

        function transmitTelemetry() {
            if (!ENDPOINT) return alert("System initializing...");
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files.length) {
                alert("Select CSV file first.");
                return;
            }

            const file = fileInput.files [ 0 ] ;
            const reader = new FileReader();

            reader.onload = function(e) {
                const textContent = e.target.result;
                document.getElementById('csv-string-payload').value = textContent;
                document.getElementById('hidden-telemetry-form').submit();
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
